<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Propiedad Horizontal</title>
</head>
<body>
    <script type="module">
        import { estaAutenticado } from './js/auth.js';
        
        // Redirigir al login si no está autenticado, o al dashboard si lo está
        (async function() {
            const autenticado = await estaAutenticado();
            if (autenticado) {
                window.location.href = 'dashboard.html';
            } else {
                window.location.href = 'login.html';
            }
        })();
    </script>
</body>
</html>
