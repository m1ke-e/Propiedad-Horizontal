<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Propiedad Horizontal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="py-4">
    <script type="module">
        import { verificarAutenticacion, esAdmin } from './js/auth.js';
        
        // Verificar autenticación y que sea admin
        (async function() {
            await verificarAutenticacion();
            const admin = await esAdmin();
            if (!admin) {
                alert('Acceso denegado: solo administradores pueden acceder');
                window.location.href = 'dashboard.html';
            }
        })();
    </script>
    <div class="container">
        <header class="text-center mb-4 p-4 bg-gradient rounded-4 border">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-3">
                <div>
                    <h1 class="display-4 fw-bold mb-2">Gestión de Propiedad Horizontal</h1>
                    <p class="text-muted fs-5">Administración de Usuarios</p>
                </div>
                <a href="dashboard.html" class="btn btn-outline-secondary text-nowrap">
                    ← Volver al Dashboard
                </a>
            </div>
        </header>

        <!-- Formulario de creación/edición -->
        <div class="card form-section">
            <div class="card-body">
                <h2 id="form-titulo" class="card-title h4 mb-4">Añadir Nuevo Usuario</h2>
                <form id="form-propietario">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="nombre" class="form-label fw-semibold">Nombre Completo *</label>
                            <input type="text" id="nombre" name="nombre" class="form-control" required>
                        </div>

                        <div class="col-md-6">
                            <label for="cedula" class="form-label fw-semibold">Cédula *</label>
                            <input type="text" id="cedula" name="cedula" class="form-control" required>
                        </div>

                        <div class="col-md-6">
                            <label for="correo" class="form-label fw-semibold">Correo (Email) *</label>
                            <input type="email" id="correo" name="correo" class="form-control" required>
                        </div>

                        <div class="col-md-6">
                            <label for="celular" class="form-label fw-semibold">Celular *</label>
                            <input type="tel" id="celular" name="celular" class="form-control" required>
                        </div>

                        <div class="col-md-6" id="password-container">
                            <label for="password" class="form-label fw-semibold">Contraseña * <span class="text-muted small">(solo crear)</span></label>
                            <input type="password" id="password" name="password" class="form-control" autocomplete="new-password">
                        </div>

                        <div class="col-md-6">
                            <label for="estado" class="form-label fw-semibold">Estado *</label>
                            <select id="estado" name="estado" class="form-select" required>
                                <option value="">Selecciona un estado</option>
                                <option value="Activo">Activo</option>
                                <option value="Inactivo">Inactivo</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <div class="d-flex gap-2 mt-3">
                                <button type="submit" id="btn-guardar" class="btn btn-primary">Guardar</button>
                                <button type="button" id="btn-cancelar" class="btn btn-outline-secondary oculto">Cancelar</button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Mensajes de estado -->
        <div id="mensaje" class="alert oculto"></div>

        <!-- Tabla de usuarios -->
        <div class="card table-section">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
                    <h2 class="h4 mb-0">Lista de Usuarios</h2>
                    <div class="d-flex gap-2 align-items-center flex-wrap">
                        <input type="text" id="busqueda" placeholder="Buscar por cédula o nombre" class="form-control search-input">
                        <button type="button" id="btn-buscar" class="btn btn-outline-primary">🔍 Buscar</button>
                        <button type="button" id="btn-limpiar" class="btn btn-outline-secondary oculto">Limpiar</button>
                    </div>
                </div>
                <div class="table-container">
                    <table id="tabla-propietarios" class="table table-hover mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>Nombre</th>
                                <th>Cédula</th>
                                <th>Estado</th>
                                <th>Celular</th>
                                <th>Correo</th>
                                <th>Fecha Creación</th>
                                <th>Fecha Modificación</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-body">
                            <tr>
                                <td colspan="8" class="text-center text-muted py-4">Cargando usuarios...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="js/config.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
