<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Propiedad Horizontal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="dashboard-container">
    <nav class="navbar dashboard-header">
        <div class="container-fluid">
            <h1 class="navbar-brand h4 mb-0">Gestión de Propiedad Horizontal</h1>
            <button id="btn-logout" class="btn btn-outline-secondary">Cerrar Sesión</button>
        </div>
    </nav>

    <div id="mensaje" class="alert oculto mx-auto" style="max-width: 1200px;"></div>

    <main class="dashboard-content">
        <div class="text-center mb-5">
            <h2 id="dashboard-title" class="dashboard-title display-5 fw-bold">Menú Principal</h2>
            <p id="dashboard-subtitle" class="dashboard-subtitle text-muted fs-5">Selecciona una opción para continuar</p>
        </div>

        <div id="dashboard-grid" class="dashboard-grid"></div>
    </main>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/config.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/dashboard.js"></script>
</body>
</html>
