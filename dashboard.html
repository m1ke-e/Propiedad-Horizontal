<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Propiedad Horizontal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
<body class="dashboard-container">
    <nav class="navbar dashboard-header">
        <div class="container-fluid">
            <h1 class="navbar-brand h4 mb-0">Gestión de Propiedad Horizontal</h1>
            <button id="btn-logout" class="btn btn-outline-secondary">Cerrar Sesión</button>
        </div>
    </nav>

    <div id="mensaje" class="alert oculto mx-auto" style="max-width: 1200px;"></div>

    <main class="dashboard-content">
        <div class="text-center mb-5">
            <h2 class="dashboard-title display-5 fw-bold">Menú Principal</h2>
            <p class="dashboard-subtitle text-muted fs-5">Selecciona una opción para continuar</p>
        </div>

        <div class="dashboard-grid">
            <div class="card dashboard-card h-100">
                <div class="card-body text-center d-flex flex-column">
                    <div class="card-icon display-1 mb-3">💰</div>
                    <h3 class="card-title h5">Facturación</h3>
                    <p class="card-text text-muted flex-grow-1">Gestión de facturas y pagos</p>
                    <button class="btn btn-primary btn-card w-100" onclick="mostrarMensaje('Facturación en desarrollo')">
                        Acceder
                    </button>
                </div>
            </div>

            <div class="card dashboard-card h-100">
                <div class="card-body text-center d-flex flex-column">
                    <div class="card-icon display-1 mb-3">📋</div>
                    <h3 class="card-title h5">PQRS</h3>
                    <p class="card-text text-muted flex-grow-1">Peticiones, Quejas, Reclamos y Sugerencias</p>
                    <button class="btn btn-primary btn-card w-100" onclick="mostrarMensaje('PQRS en desarrollo')">
                        Acceder
                    </button>
                </div>
            </div>

            <div class="card dashboard-card h-100">
                <div class="card-body text-center d-flex flex-column">
                    <div class="card-icon display-1 mb-3">👥</div>
                    <h3 class="card-title h5">CRUD</h3>
                    <p class="card-text text-muted flex-grow-1">Administración de Usuarios</p>
                    <button class="btn btn-primary btn-card w-100" onclick="window.location.href='crud.html'">
                        Acceder
                    </button>
                </div>
            </div>
        </div>
    </main>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/config.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/dashboard.js"></script>
</body>
</html>
