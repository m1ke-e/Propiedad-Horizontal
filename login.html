<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión - Propiedad Horizontal UNIJC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="min-vh-100 d-flex align-items-center justify-content-center">
    <div class="login-container">
        <div class="card login-card">
            <div class="card-body">
                <div class="login-header text-center mb-4">
                    <h1 class="h3 mb-2">Gestión de Propiedad Horizontal</h1>
                </div>

                <!-- Tabs para Login / Registro -->
                <ul class="nav nav-tabs mb-4" id="authTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login-pane" type="button" role="tab">Iniciar Sesión</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="registro-tab" data-bs-toggle="tab" data-bs-target="#registro-pane" type="button" role="tab">Registrarse</button>
                    </li>
                </ul>

                <div class="tab-content" id="authTabContent">
                    <div class="tab-pane fade show active" id="login-pane" role="tabpanel">
                        <form id="login-form" class="login-form">
                            <div id="mensaje-login" class="alert oculto mb-3"></div>

                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">Email</label>
                                <input type="email" id="email" name="email" class="form-control" required autocomplete="email">
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label fw-semibold">Contraseña</label>
                                <input type="password" id="password" name="password" class="form-control" required autocomplete="current-password">
                            </div>

                            <button type="submit" class="btn btn-primary btn-login w-100">Iniciar Sesión</button>
                        </form>

                        <a href="#" id="forgot-password-link" class="text-decoration-none d-block text-center mt-3">¿Olvidaste tu contraseña?</a>
                    </div>

                    <div class="tab-pane fade" id="registro-pane" role="tabpanel">
                        <form id="registro-form" class="registro-form">
                            <div id="mensaje-registro" class="alert oculto mb-3"></div>

                            <div class="mb-3">
                                <label for="reg-nombre" class="form-label fw-semibold">Nombre Completo *</label>
                                <input type="text" id="reg-nombre" name="nombre" class="form-control" required minlength="3">
                            </div>

                            <div class="mb-3">
                                <label for="reg-cedula" class="form-label fw-semibold">Cédula *</label>
                                <input type="number" id="reg-cedula" name="cedula" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label for="reg-email" class="form-label fw-semibold">Email *</label>
                                <input type="email" id="reg-email" name="email" class="form-control" required autocomplete="email">
                            </div>

                            <div class="mb-3">
                                <label for="reg-celular" class="form-label fw-semibold">Celular *</label>
                                <input type="tel" id="reg-celular" name="celular" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label for="reg-password" class="form-label fw-semibold">Contraseña *</label>
                                <input type="password" id="reg-password" name="password" class="form-control" required minlength="6" autocomplete="new-password">
                                <small class="text-muted">Mínimo 6 caracteres: mayúscula, minúscula, número y símbolo</small>
                            </div>

                            <div class="mb-3">
                                <label for="reg-password-confirm" class="form-label fw-semibold">Confirmar Contraseña *</label>
                                <input type="password" id="reg-password-confirm" name="password-confirm" class="form-control" required minlength="6" autocomplete="new-password">
                            </div>

                            <button type="submit" class="btn btn-success btn-login w-100">Crear Cuenta</button>
                        </form>
                    </div>
                </div>

                <!-- Sección de recuperación de contraseña -->
                <div id="reset-password-section" class="mt-4" style="display: none;">
                    <h5 class="text-center">Recuperar Contraseña</h5>
                    <div id="mensaje-reset" class="alert oculto mb-3"></div>
                    <div class="mb-3">
                        <label for="reset-email" class="form-label">Email</label>
                        <input type="email" id="reset-email" class="form-control" required>
                    </div>
                    <button id="btn-reset-password" class="btn btn-secondary w-100">Enviar Enlace de Recuperación</button>
                    <button id="btn-cancel-reset" class="btn btn-outline-secondary w-100 mt-2">Cancelar</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/config.js"></script>
    <script type="module" src="js/login.js"></script>
</body>
</html>
